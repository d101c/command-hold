[project]
name = "command-hold-engine"
version = "0.1.0"
description = "Local voice-command helper for the Command Hold GNOME Shell extension (D-Bus service: intent rules, optional local LLM, shell jobs)."
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.12"
authors = [{name = "Julien Griffit"}]
dependencies = [
    "dbus-fast>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
command-hold-engine = "command_hold_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/command_hold_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
